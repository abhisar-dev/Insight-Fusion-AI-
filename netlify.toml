# Netlify Configuration for InsightFusion AI
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Fallback for Single Page Application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
